[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flag-football-playbook"
version = "0.1.0"
description = "Describe 5v5 flag-football plays and print wrist-bracelet cards"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Flag Playbook Contributors" }]
dependencies = []

[project.scripts]
flag-play = "flag_playbook.cli:main"
blackjack-sim = "blackjack_sim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
