name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --no-deps -e .
      - run: python -m unittest discover -s tests -v
      - run: flag-play card "1445 | CI Smoke Test" --output results/play-card.svg
      - run: flag-play sheet examples/playbook.json --output results/play-sheet.svg
      - run: >-
          blackjack-sim --rounds 1000
          --csv results/smoke.csv
          --scatter results/complexity-smoke.svg
          --bar-plot results/profitability-smoke.svg
